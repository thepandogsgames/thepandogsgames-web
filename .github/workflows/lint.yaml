name: Lint files

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-astro-files:
    name: Check Astro Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier
        run: pnpm run check-astro-files

      - name: Build site
        run: pnpm run build
